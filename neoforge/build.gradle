plugins {
    id "com.gradleup.shadow" version "8.3.11"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    neoForge {
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {
    def replaceProperties = [
            version: project.version,
            mod_id: rootProject.mod_id,
            mod_name: rootProject.mod_name,
            mod_author: rootProject.mod_author,
            mod_license: rootProject.mod_license,
            mod_description: rootProject.mod_description,
            loader_version_range: rootProject.loader_version_range,
            neoforge_version_range: rootProject.neoforge_version_range,
            minecraft_version_range: rootProject.minecraft_version_range,
            smallships_version_range: rootProject.smallships_version_range
    ]
    inputs.properties replaceProperties

    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}

tasks.register("verifyMixinMetadata") {
    dependsOn processResources
    def metadataFile = layout.buildDirectory.file("resources/main/META-INF/neoforge.mods.toml")
    inputs.file(metadataFile)

    doLast {
        def metadata = metadataFile.get().asFile.getText("UTF-8")
        if (!metadata.contains('config = "smallshipsheraldry-common.mixins.json"')) {
            throw new GradleException("NeoForge metadata does not register the common mixin configuration")
        }
    }
}

tasks.named("check") {
    dependsOn verifyMixinMetadata
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set null
}

jar {
    archiveClassifier.set "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
    }
}
