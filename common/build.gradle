architectury {
    common(rootProject.enabled_platforms.split(","))
}

dependencies {
    // Fabric loader is needed here so common sources can compile in the shared environment.
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // Compile against Small Ships classes from the shared sources without leaking the Fabric jar into Forge runtime.
    modCompileOnly "maven.modrinth:${rootProject.smallships_modrinth_artifact}:${rootProject.smallships_fabric_modrinth_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
}

tasks.named("test") {
    useJUnitPlatform()
}

processResources {
    inputs.file(rootProject.file("LICENSE"))
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_${rootProject.mod_id}" }
    }
}

tasks.register("exportSailBlockbench", JavaExec) {
    group = "smallshipsheraldry"
    description = "Exports Small Ships sail meshes as OBJ files plus a paintable manifest for Blockbench review."
    mainClass = "me.mss1r.smallshipsheraldry.dev.SailModelExportTool"
    classpath = sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    args rootProject.layout.projectDirectory.dir("exports/blockbench").asFile.absolutePath
}

// The exporter is a developer utility. Keep it available to Gradle, but never
// include it in distributable binaries or source artifacts.
tasks.named("jar") {
    exclude("me/mss1r/smallshipsheraldry/dev/**")
}

tasks.named("sourcesJar") {
    exclude("me/mss1r/smallshipsheraldry/dev/**")
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
